<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Shader Remote</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: #000;
            color: #fff;
            font-family: monospace;
            overscroll-behavior: none;
        }

        #app {
            max-width: 600px;
            margin: 0 auto;
            padding: 12px 16px 40px;
        }

        /* Header */
        #header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.95);
            padding: 10px 0;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        #status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        #status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f33;
            flex-shrink: 0;
        }

        #status-dot.connected {
            background: #0f0;
        }

        #current-shader {
            color: #f80;
            font-size: 14px;
            margin-top: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Shader navigation */
        #shader-nav {
            display: flex;
            gap: 10px;
            margin: 14px 0;
        }

        .nav-btn {
            flex: 1;
            padding: 18px 0;
            font-size: 22px;
            font-family: monospace;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .nav-btn:active {
            background: rgba(255, 136, 0, 0.4);
            border-color: #f80;
        }

        #shader-select {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            font-family: monospace;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            margin-bottom: 6px;
        }

        #shader-select option {
            background: #111;
        }

        /* Sections */
        .section-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin: 22px 0 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 4px;
        }

        /* Sliders */
        .param-row {
            margin: 14px 0;
        }

        .param-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .param-value {
            color: #f80;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 34px;
            background: transparent;
            touch-action: none;
        }

        input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 30px;
            height: 30px;
            margin-top: -11px;
            background: #f80;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        input[type="range"]::-moz-range-track {
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        input[type="range"]::-moz-range-thumb {
            width: 28px;
            height: 28px;
            background: #f80;
            border-radius: 50%;
            border: 2px solid #fff;
        }

        /* Toggle buttons */
        .toggle-btn {
            width: 100%;
            padding: 14px 0;
            font-size: 14px;
            font-family: monospace;
            color: #fff;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            cursor: pointer;
            margin: 6px 0;
            touch-action: manipulation;
        }

        .toggle-btn.on {
            background: rgba(255, 136, 0, 0.4);
            border-color: #f80;
        }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <div id="status-row">
                <div id="status-dot"></div>
                <span id="status-text">Connecting...</span>
            </div>
            <div id="current-shader">–</div>
        </div>

        <div id="shader-nav">
            <button class="nav-btn" id="prev-btn">◀ PREV</button>
            <button class="nav-btn" id="next-btn">NEXT ▶</button>
        </div>
        <select id="shader-select"></select>

        <div class="section-title">Image</div>
        <div id="params-main"></div>

        <div class="section-title">Audio</div>
        <div id="params-audio"></div>

        <div class="section-title">Mirror / Edit</div>
        <button class="toggle-btn" id="mirror-btn">Mirror: OFF</button>
        <div id="params-mirror"></div>
        <button class="toggle-btn" id="edit-btn">Edit Mode: OFF</button>
    </div>
    <script type="module" src="/src/remote.js"></script>
</body>
</html>
